<section aria-label="Perfil de usuario">
  <h2>Perfil</h2>
  <div class="perfil-grid">
    <img src="{{ user.profile.photo_url|default:static('usuarios/default-avatar.png') }}" alt="Foto" class="avatar">
    <div class="perfil-info">
      <p><strong>Nombre:</strong> {{ user.get_full_name }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      {% if user.profile.bio %}
      <p><strong>Bio:</strong> {{ user.profile.bio }}</p>
      {% endif %}
    </div>
  </div>
</section>
