{% load static %}
<style>

    @font-face {
    font-family: '1';
    src: url('/static/usuarios/fonts/COVERS SHORES DEMO.ttf') format('truetype');
}

/* RESET & BASE */
.profile-container * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.profile-title {
    position: absolute;
    top: 24px;
    left: 32px;
    z-index: 3;

    font-family: '1', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.45rem;
    color: #ffffff;
}

.profile-username {
    position: absolute;
    inset: 0;
    z-index: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: '1', sans-serif;
    font-size: clamp(4rem, 11vw, 9rem);
    line-height: 0.85;

    text-transform: uppercase;
    color: rgb(255, 255, 255);

    white-space: nowrap;
    pointer-events: none;
}
.profile-container {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    color: #e2e8f0;
}

/* BANNER */
.profile-banner {
    position: relative;
    height: 180px;
    border-radius: 28px;
    background: linear-gradient(135deg, #020617, #0f172a, #020617);
    border: 1px solid rgba(0, 170, 255, 0.3);
    box-shadow: 0 0 28px rgba(0, 170, 255, 0.25);
    overflow: hidden;
    transition: box-shadow 0.3s ease;
}

.profile-banner:hover {
    box-shadow: 0 0 35px rgba(0, 170, 255, 0.4);
}

/* Glow animado */
.profile-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent, #00aaff, transparent);
    opacity: 0.25;
    transform: translateX(-100%);
    transition: transform 0.6s ease;
}

.profile-banner:hover::before {
    transform: translateX(100%);
}

/* BOTÓN DE CERRAR SESIÓN (NUEVO AGREGADO) */
.logout-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.4);
    color: #f87171;
    border-radius: 14px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}

.logout-btn:hover {
    background: #f87171;
    color: #fff;
    box-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
    transform: translateY(-2px);
    border-color: #f87171;
}



/* GRID */
.profile-grid {
    margin-top: 70px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
}

/* CARDS - con efectos de botón mejorados */
.profile-card {
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 20px;
    border: 1px solid rgba(0, 170, 255, 0.2);
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

/* Efecto hover principal */
.profile-card:hover {
    transform: translateY(-6px);
    border-color: rgba(0, 170, 255, 0.6);
    box-shadow: 0 12px 28px rgba(0, 170, 255, 0.3);
    background: rgba(15, 23, 42, 0.8);
}

/* Línea de brillo al pasar el mouse (efecto láser) */
.profile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 170, 255, 0.2), transparent);
    transition: left 0.5s ease;
    pointer-events: none;
}

.profile-card:hover::before {
    left: 100%;
}

/* Efecto de borde neón sutil en hover */
.profile-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(0, 170, 255, 0.4), rgba(0, 170, 255, 0));
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.profile-card:hover::after {
    opacity: 1;
}

/* Títulos dentro de cards */
.profile-card h3 {
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #cbd5e1;
}

.profile-card p {
    color: #94a3b8;
    font-weight: 500;
    margin-bottom: 12px;
}

/* Barra de progreso mejorada */
.bar {
    height: 8px;
    background: #020617;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 12px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
}

.bar span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #00aaff, #0099dd);
    box-shadow: 0 0 6px #00aaff;
    border-radius: 12px;
    transition: width 0.4s ease;
}

/* Lista de logros */
.profile-logros {
    list-style: none;
    margin-top: 12px;
}

.profile-logros li {
    margin: 10px 0;
    padding: 8px 12px;
    border-radius: 40px;
    background: rgba(2, 6, 23, 0.7);
    border: 1px solid rgba(0, 170, 255, 0.25);
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.profile-logros li::before {
    content: "🏅";
    font-size: 1rem;
    filter: drop-shadow(0 0 2px #00aaff);
}

.profile-logros li:hover {
    background: rgba(0, 170, 255, 0.1);
    border-color: #00aaff;
    transform: translateX(5px);
    box-shadow: 0 2px 8px rgba(0, 170, 255, 0.2);
}

/* Nivel card especial */
.profile-card:last-child .bar span {
    background: linear-gradient(90deg, #ffaa00, #ffcc44);
    box-shadow: 0 0 8px #ffaa44;
}

/* Responsive */
@media (max-width: 640px) {
    .profile-banner {
        height: 150px;
    }
    .profile-header h1 {
        font-size: 1.2rem;
    }
    .profile-header p {
        font-size: 0.7rem;
    }
    .profile-avatar {
        width: 65px;
        height: 65px;
        bottom: -25px;
        right: 20px;
    }
    .profile-grid {
        gap: 16px;
        margin-top: 50px;
    }
    .profile-card {
        padding: 16px;
    }
    .logout-btn {
        padding: 8px 12px;
        font-size: 0.65rem;
        top: 10px;
        right: 10px;
    }
   .profile-banner {
    position: relative;
    height: 220px;
    border-radius: 28px;
    overflow: hidden;
}

}

</style>

<div class="profile-container">

    <div class="profile-banner">

        <a href="{% url 'logout' %}" class="logout-btn">
            Cerrar Sesión ✕
        </a>

        <div class="profile-title">
            PERFIL
        </div>

        <div class="profile-username">
            {{ request.user.username }}
        </div>

    </div>

    <div class="profile-grid">

        <div class="profile-card">
            <h3>📚 Cursos completados</h3>
            <p>{{ cursos_completados.count }} / {{ inscripciones.count }}</p>
            <div class="bar">
                <span style="width: {{ porcentaje_cursos }}%"></span>
            </div>
        </div>

        <div class="profile-card">
            <h3>📘 Cursos en progreso</h3>
            <p>{{ cursos_en_progreso.count }}</p>
            <div class="bar">
                <span style="width: {{ porcentaje_cursos_progreso }}%"></span>
            </div>
        </div>

        <div class="profile-card">
            <h3>🧪 Labs completados</h3>
            <p>{{ labs_completados }}</p>
            <div class="bar">
                <span style="width: {{ porcentaje_labs }}%"></span>
            </div>
        </div>

        <div class="profile-card">
            <h3>⚙️ Labs en progreso</h3>
            <p>{{ labs_en_progreso }}</p>
            <div class="bar">
                <span style="width: {{ porcentaje_labs_progreso }}%"></span>
            </div>
        </div>

    </div>

</div>
